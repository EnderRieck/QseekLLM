extends:
  - ../data/mixture_50b.yaml
  - ../tokenizer/hf_byte_bpe_150k.yaml
  - ../model/qwen_like_700m.yaml

run:
  name: stage1_general_700m_smoke
  output_dir: runs/stage1_general_700m_smoke
  seed: 42

data:
  manifest_path: examples/data/manifest.jsonl
  validate_hashes: true
  reader:
    parquet_batch_size: 1024
  mixer:
    temperature: 1.0
    seed: 42
  packing:
    seq_len: 512
    batch_size: 1
    async_tokenization: true
    producer_workers: 2
    queue_max_batches: 8

trainer:
  micro_batch_size: 1
  global_batch_size: 8
  max_tokens: 100_000
  max_steps: null
  checkpoint_interval_steps: 50
  optimizer: {type: adamw, lr: 2.5e-4, betas: [0.9, 0.95], weight_decay: 0.1}
  scheduler: {type: cosine, warmup_tokens: 10_000, min_lr_ratio: 0.1}
  precision: bf16
  grad_clip: 1.0

checkpoint:
  save_interval_minutes: 30
  milestone_interval_tokens: 50_000
  keep_latest: 2

distributed:
  backend: ddp
  activation_checkpointing: true

observability:
  metrics_jsonl: true
  events_jsonl: true
  data_metrics_jsonl: true
  heartbeat: true
  console_interval_steps: 1
  heartbeat_interval_seconds: 60
  data_metrics_interval_seconds: 30
  tensorboard: false
  wandb: false
  collect_histograms: false
  collect_tokenizer_stats: false
  loss_spike_window: 10
  loss_spike_sigma: 5.0
