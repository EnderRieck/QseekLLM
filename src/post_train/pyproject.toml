[project]
name = "fastrl"
version = "0.1.0"
description = "fastrl post-training experiments built on the local verl snapshot"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.13.0",
    "aiohttp==3.14.0",
    "datasets==4.8.5",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl",
    "flashinfer-python @ https://github.com/flashinfer-ai/flashinfer/releases/download/v0.2.2.post1/flashinfer_python-0.2.2.post1+cu124torch2.6-cp38-abi3-linux_x86_64.whl",
    "huggingface-hub==0.36.2",
    "idna==3.18",
    "liger-kernel==0.8.0",
    "math-verify==0.9.0",
    "mathruler==0.1.0",
    "mistral-common==1.11.2",
    "openai==2.40.0",
    "packaging==25.0",
    "peft==0.19.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-rerunfailures==16.3",
    "python-multipart==0.0.30",
    "qwen-vl-utils==0.0.14",
    "ray==2.55.1",
    "rich-toolkit==0.19.10",
    "setuptools==81.0.0",
    "tensorboard==2.20.0",
    "tensordict==0.10.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchdata==0.11.0",
    "torchvision==0.21.0",
    "transformers==4.51.3",
    "uvicorn==0.48.0",
    "verl[gpu,math,geo,vllm,test]",
    "vllm==0.8.5.post1",
    "wandb==0.27.0",
    "xformers==0.0.29.post2",
]

[tool.uv.sources]
verl = { path = "verl", editable = true }

[tool.uv]
override-dependencies = [
    "ray==2.55.1",
]
